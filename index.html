<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Password Auditor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">

            <img
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbmxzFUH0006UbEyxvvN9NCmMGLXrVWuqPdA&s"
                alt="Lock Logo"
                class="logo">

            <h1>Cyber Password Auditor</h1>

        </div>

        <p class="subtitle">
            Evaluate password strength and identify security weaknesses.
        </p>

        <input
    type="password"
    id="password"
    placeholder="Enter Password"
    onkeydown="if(event.key === 'Enter') auditPassword()">

        <div class="toggle-container">

            <input
                type="checkbox"
                id="showPassword">

            <label for="showPassword">
                Show Password
            </label>

        </div>

        <button onclick="auditPassword()">
            Analyze Password
        </button>

        <div class="strength-container">

            <div class="strength-bar">

                <div id="strengthFill"></div>

            </div>

            <p id="strengthText"></p>

        </div>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
