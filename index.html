<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Password Auditor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🔐 Cyber Password Auditor</h1>

        <p class="subtitle">
            Evaluate password strength and identify security weaknesses.
        </p>

        <input
            type="password"
            id="password"
            placeholder="Enter Password">

        <div class="toggle-container">
            <input type="checkbox" id="showPassword">
            <label for="showPassword">Show Password</label>
        </div>

        <button onclick="auditPassword()">
            Analyze Password
        </button>

        <div class="strength-container">

            <div class="strength-bar">
                <div id="strengthFill"></div>
            </div>

            <p id="strengthText"></p>

        </div>

        <div id="results"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
